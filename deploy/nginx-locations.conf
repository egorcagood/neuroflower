# Insert inside your existing HTTPS server block. Replace no unrelated routes.
location = /neuroflower/v1/readings {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8797/v1/readings;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
}
# The character gateway stays on loopback; Simon uses it locally.
