<text x="885" y="215.23" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17805c">Ряд 3 — SDA</text>
<text x="885" y="266.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">A3  ←  GPIO8 ESP32</text>
<text x="885" y="308.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">B3  ←  SDA/RH фиолетового</text>
<text x="885" y="350.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">C3  ←  SDA синего</text>
<text x="885" y="425.23" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#aa7200">Ряд 5 — SCL</text>
<text x="885" y="476.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">A5  ←  GPIO9 ESP32</text>
<text x="885" y="518.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">B5  ←  SCL/T фиолетового</text>
<text x="885" y="560.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152b36">C5  ←  SCL синего</text>
<text x="885" y="635.23" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#152b36">Питание и почва</text>
<text x="885" y="685.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">«+» ← 3V3 и питание трёх датчиков</text>
<text x="885" y="724.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">«−» ← GND и земли трёх датчиков</text>
<text x="885" y="763.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">AOUT почвы → GPIO4 напрямую</text>
<text x="885" y="802.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">ADD синего → не подключать</text>
<text x="50" y="892.62" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#152b36">A–E одного номера соединены. F–J того же номера — отдельная группа.</text>
<text x="50" y="940.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">Через центральную канавку контакта нет. Разные номера рядов тоже не соединены.</text>
<text x="50" y="985.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">Шины «+» и «−» могут иметь разрыв: используйте один непрерывный участок каждой.</text>
<text x="50" y="1025.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">Нумерацию сверяйте со своей макеткой. Не соединяйте «+» и «−» между собой.</text>
</svg>