<text x="55" y="861.75" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152b36">Точка на пересечении = соединение. Пересечения без точки не соединены.</text>
<text x="55" y="905.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">Это электрическая схема: положение выводов на рисунке не повторяет расположение ножек платы.</text>
<text x="55" y="950.88" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#152b36">GPIO — номер на маркировке ESP32. Не подключать питание датчиков к 5V / VBUS.</text>
